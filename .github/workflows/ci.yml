name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - "1.85.0"
          - stable
          - beta
          - nightly
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check
      if: matrix.rust == 'stable'

    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      if: matrix.rust == 'stable'

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Run tests with release mode
      run: cargo test --release --verbose
      if: matrix.rust == 'stable'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-tarpaulin
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-tarpaulin
        version: 0.37.5

    - name: Generate coverage report
      run: cargo tarpaulin --engine llvm --all-features --workspace --timeout 120 --fail-under 90 --out Xml --out Json --output-dir coverage

    - name: Preserve coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-linux
        path: coverage/
        if-no-files-found: warn

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-audit

    - name: Security audit
      run: cargo audit

  cross-platform:
    name: Cross Platform
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-stable-
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  upstream-compatibility:
    name: Compatibility with pv 1.12.0
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Build pinned upstream reference
      run: |
        curl --fail --location --retry 3 https://ivarch.com/s/pv-1.12.0.tar.gz --output "$RUNNER_TEMP/pv-reference.tar.gz"
        printf '%s  %s\n' '31fdbdb449c7143cd2968567bef7599e9f031950e6158ee7bb76e40aebf6ffb8' "$RUNNER_TEMP/pv-reference.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/pv-reference.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/pv-1.12.0"
        ./configure
        make -j2
    - name: Compare behavioral contracts
      run: PV_REFERENCE="$RUNNER_TEMP/pv-1.12.0/pv" cargo test --locked --test compatibility_tests

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: cargo build --locked
    - name: Check generated man page and local examples
      run: |
        python3 scripts/generate_man.py --binary target/debug/pv --check
        python3 scripts/check_examples.py --binary target/debug/pv
    - name: Render man page
      run: |
        sudo apt-get update
        sudo apt-get install -y groff
        groff -man -Tutf8 -ww docs/pv.1 > /dev/null

  linux-32-bit:
    name: Linux 32-bit reliability
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: i686-unknown-linux-gnu
    - name: Install 32-bit linker and C runtime
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
    - name: Run native 32-bit reliability and resource tests
      run: cargo test --locked --target i686-unknown-linux-gnu --test reliability_tests --test resource_limits
