name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests
      run: cargo test --verbose

    - name: Check if update is minor/patch only
      id: check_version
      if: success()
      run: |
        TITLE="${{ github.event.pull_request.title }}"
        # Extract old and new versions
        OLD_VER=$(echo "$TITLE" | grep -oP 'from \K[^ ]+')
        NEW_VER=$(echo "$TITLE" | grep -oP 'to \K[^ ]+')

        if [ -z "$OLD_VER" ] || [ -z "$NEW_VER" ]; then
          echo "Could not parse versions, skipping auto-merge"
          echo "should_merge=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Extract major versions
        OLD_MAJOR=$(echo "$OLD_VER" | cut -d. -f1)
        NEW_MAJOR=$(echo "$NEW_VER" | cut -d. -f1)

        if [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
          echo "Major version bump detected ($OLD_VER -> $NEW_VER), not auto-merging"
          echo "should_merge=false" >> $GITHUB_OUTPUT
        else
          echo "Minor/patch update ($OLD_VER -> $NEW_VER), auto-merging"
          echo "should_merge=true" >> $GITHUB_OUTPUT
        fi

    - name: Auto-merge minor and patch updates
      if: success() && steps.check_version.outputs.should_merge == 'true'
      run: |
        gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}