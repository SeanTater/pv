[package]
name = "pv"
version = "0.6.0"
authors = ["Sean Gallagher <stgallag@gmail.com>"]
edition = "2021"
rust-version = "1.85"
description = "Rust reimplementation of the unix pipeview (pv) utility"
license = "MIT"
documentation = "https://docs.rs/pv"
homepage = "https://github.com/SeanTater/pv"
repository = "https://github.com/SeanTater/pv"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "^4.5", features = [ "derive" ] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "^3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "^2"
predicates = "^3"

[profile.release]
strip = "symbols"
